<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prueba Jurisprudencias</title>
</head>
<body>
    <h1>Prueba de Jurisprudencias</h1>
    <div id="test">Cargando...</div>

    <script>
        fetch('/api/jurisprudencias')
            .then(res => res.json())
            .then(data => {
                document.getElementById('test').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(err => {
                document.getElementById('test').innerHTML = 'Error: ' + err.message;
            });
    </script>
</body>
</html>
